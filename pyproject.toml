[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.1.0"
description = "Kişisel hafıza destekli yerel RAG mimarisiyle yapay zeka chatbot"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Muhammet Doğukan Bingöl" },
    { name = "Beyza Sude Aydın" },
]
keywords = ["rag", "llm", "chatbot", "chromadb", "embedding", "nlp", "local-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
    "ollama>=0.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
eval = [
    "nltk>=3.8.0",
    "bert-score>=0.3.13",
]

[project.scripts]
local-rag = "local_rag.cli:main"

[project.urls]
Repository = "https://github.com/<kullanici-adi>/local-rag"
Issues = "https://github.com/<kullanici-adi>/local-rag/issues"

[tool.setuptools.packages.find]
where = ["src"]

# ===== Ruff (linter + formatter) =====
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # line-too-long, formatter halletsin

# ===== mypy =====
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

# ===== pytest =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
